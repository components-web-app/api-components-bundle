parameters:
    env(TEST_DATABASE_PATH): '%kernel.cache_dir%/../../db.sqlite'

doctrine:
    dbal:
        driver: 'pdo_sqlite'
        path: '%env(resolve:TEST_DATABASE_PATH)%'
        charset: 'UTF8'
    orm:
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: false
        mappings:
            TestBundle:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/../TestBundle/Entity'
                prefix: 'Silverback\ApiComponentsBundle\Tests\Functional\TestBundle\Entity'
                alias: TestBundle

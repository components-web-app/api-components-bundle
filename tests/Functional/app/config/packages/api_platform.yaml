api_platform:
    version: 1.0.0
    mercure: ~
    mapping:
        paths:
            - '%kernel.project_dir%/../TestBundle/Entity'
    formats:
        jsonld: ['application/ld+json']
        multipart: ['multipart/form-data']
    docs_formats:
        jsonld: ['application/ld+json']
        json: ['application/json']
        jsonopenapi: ['application/vnd.openapi+json']
        html: ['text/html']
    patch_formats:
        json: ['application/merge-patch+json']
    swagger:
        versions: [3]
    # use doctrine/inflector
    # keep_legacy_inflector: true
    http_cache:
        invalidation:
            purger: 'api_platform.http_cache.purger.varnish.xkey'
            enabled: true
            urls: [ 'http://test' ]
        public: true
    exception_to_status:
        Symfony\Component\Serializer\Exception\NotNormalizableValueException: 422
        TypeError: 422
    defaults:
        standard_put: true
        extra_properties:
            rfc_7807_compliant_errors: true
        cache_headers:
            shared_max_age: 3600
            invalidation:
                xkey:
                    glue: ' '

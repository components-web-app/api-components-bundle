    strategy:
      matrix:
        php:
          - '8.5'
        symfony:
          - '^7.4'
      fail-fast: false
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        env:
            GD_CONFIGURE_OPTS: --enable-gd=shared,/usr --with-external-gd --with-jpeg --with-freetype
            GD_LIBS: libjpeg-dev libpng-dev
            GD_PATH: ext/gd
        with:

name: CI

on:
  push:
    branches:
      - '*'
      - '!v1'
  pull_request:
    branches-ignore:
      - v1

env:
  COMPOSER_ALLOW_SUPERUSER: '1' # https://getcomposer.org/doc/03-cli.md#composer-allow-superuser
  COVERAGE: '0'
  INFECTION_VERSION: '0.35.4'
  COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  php-cs-fixer:
    name: PHP-CS-Fixer (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
          - '8.5'
      fail-fast: false
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, bcmath, curl, openssl, mbstring, gd
          ini-values: memory_limit=-1
          tools: pecl, composer, php-cs-fixer
          coverage: none
      - name: Run PHP-CS-Fixer fix
        run: php-cs-fixer fix --dry-run --diff --ansi --allow-unsupported-php-version 8.5

  phpstan:
    name: PHPStan (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
          - '8.5'
      fail-fast: false
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, bcmath, curl, openssl, mbstring, gd
          ini-values: memory_limit=-1
          tools: composer
          coverage: none
      - name: Get composer cache directory
        id: composercache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composercache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Update project dependencies
        run: composer update --no-progress --ansi
      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --ansi

  phpunit:
    name: PHPUnit (Symfony ${{ matrix.symfony }}) (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      matrix:
        php:
          - '8.5'
        symfony:
          - '7.4'
          - '8.1'
        experimental:
            - false
        include:
          - php: '8.5'
            symfony: '7.4'
            experimental: false
            coverage: true
      fail-fast: false
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        env:
            GD_CONFIGURE_OPTS: --enable-gd=shared,/usr --with-external-gd --with-jpeg --with-freetype
            GD_LIBS: libjpeg-dev libpng-dev
            GD_PATH: ext/gd
        with:
          php-version: ${{ matrix.php }}
          tools: pecl, composer
          extensions: intl, bcmath, curl, openssl, mbstring, pdo_sqlite, exif, xsl, gd
          coverage: pcov
          ini-values: memory_limit=-1
      - name: Get composer cache directory
        id: composercache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composercache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Enable code coverage
        if: matrix.coverage
        run: echo "COVERAGE=1" >> $GITHUB_ENV
      - name: Disable deprecations helper
        if: ${{ !matrix.coverage }}
        run: echo "SYMFONY_DEPRECATIONS_HELPER=disabled=1" >> $GITHUB_ENV
      - name: Update project dependencies
        run: |
          composer config extra.symfony.require ${{ matrix.symfony }}
          composer update --no-progress --ansi
      - name: Install PHPUnit
        run: vendor/bin/simple-phpunit --version
      - name: Clear test app cache
        run: tests/Functional/app/bin/console cache:clear --ansi
      - name: Run PHPUnit tests
        run: |
          mkdir -p build/logs/phpunit
          if [ "$COVERAGE" = '1' ]; then
            vendor/bin/simple-phpunit --configuration=phpunit.coverage.xml.dist --coverage-xml=build/logs/phpunit/coverage-xml --coverage-clover=build/logs/phpunit/clover.xml --log-junit=build/logs/phpunit/junit.xml
          else
            vendor/bin/simple-phpunit --log-junit build/logs/phpunit/junit.xml
          fi
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-logs-php${{ matrix.php }}-symfony${{ matrix.symfony }}
          path: build/logs/phpunit
        continue-on-error: true
      - name: Upload coverage results to Codecov
        if: matrix.coverage
        uses: codecov/codecov-action@v4
        with:
          flags: phpunit
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Download Infection
        if: matrix.coverage
        run: |
          wget https://github.com/infection/infection/releases/download/$INFECTION_VERSION/infection.phar
          wget https://github.com/infection/infection/releases/download/$INFECTION_VERSION/infection.phar.asc
          gpg --import .github/infection-signing-key.asc
          gpg --with-fingerprint --verify infection.phar.asc infection.phar
          chmod +x infection.phar
      - name: Run Infection Mutation Tests
        if: matrix.coverage && github.event_name != 'pull_request'
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
        run: ./infection.phar --coverage=build/logs/phpunit --min-covered-msi=80 --threads=30
      - name: Run Infection Mutation Tests on changed lines
        if: matrix.coverage && github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -f "$(git rev-parse --git-dir)/shallow" ]; then UNSHALLOW=--unshallow; else UNSHALLOW=; fi
          git fetch --no-tags $UNSHALLOW origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          echo "Merge base of origin/$BASE_REF and HEAD: $(git merge-base "origin/$BASE_REF" HEAD)"
          git diff --stat "origin/$BASE_REF...HEAD" -- src
          ./infection.phar --coverage=build/logs/phpunit --min-covered-msi=80 --threads=30 --git-diff-lines --git-diff-base="origin/$BASE_REF" --ignore-msi-with-no-mutations
      - name: Upload Infection Mutation Logs
        if: always() && matrix.coverage
        uses: actions/upload-artifact@v4
        with:
          name: infection-logs-php${{ matrix.php }}
          path: build/logs/infection*

  behat:
    name: Behat (Symfony ${{ matrix.symfony }}) (API Platform ${{ matrix.api-platform }}) (PHP ${{ matrix.php }})${{ matrix.symfony-listeners == '1' && ' (use_symfony_listeners)' || '' }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      matrix:
        php:
          - '8.5'
        symfony:
          - '7.4'
          - '8.1'
        api-platform:
          - '^4.4'
          - '^5.0'
        experimental:
          - false
        symfony-listeners:
          - ''
        include:
          - php: '8.5'
            symfony: '7.4'
            api-platform: '^5.0'
            experimental: false
            symfony-listeners: ''
            coverage: true
          - php: '8.5'
            symfony: '7.4'
            api-platform: '^4.4'
            experimental: false
            symfony-listeners: '1'
      fail-fast: false
    timeout-minutes: 20
    env:
      API_PLATFORM_USE_SYMFONY_LISTENERS: ${{ matrix.symfony-listeners }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        env:
            GD_CONFIGURE_OPTS: --enable-gd=shared,/usr --with-external-gd --with-jpeg --with-freetype
            GD_LIBS: libjpeg-dev libpng-dev
            GD_PATH: ext/gd
        with:
          php-version: ${{ matrix.php }}
          tools: pecl, composer
          extensions: intl, bcmath, curl, openssl, mbstring, pdo_sqlite, exif, xsl, gd
          coverage: pcov
          ini-values: memory_limit=-1
      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - name: Restore composer cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-php${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            composer-php${{ matrix.php }}-
        continue-on-error: true
      - name: Update project dependencies
        run: |
          composer config extra.symfony.require ${{ matrix.symfony }}
          composer require "api-platform/core:${{ matrix.api-platform }}" --no-update --no-interaction
          composer update --no-progress --ansi
      - name: Clear test app cache
        run: tests/Functional/app/bin/console cache:clear --ansi
      - name: Enable code coverage
        if: matrix.coverage
        run: echo "COVERAGE=1" >> $GITHUB_ENV
      - name: Run Behat tests
        run: |
          mkdir -p build/logs/behat
          if [ "$COVERAGE" = '1' ]; then
            php -d memory_limit=-1 -d pcov.enabled=1 -d error_reporting="E_ALL & ~E_NOTICE & ~E_DEPRECATED" bin/behat-parallel --junit=build/logs/behat/junit -- --profile=default-coverage --colors --tags='~@wip'
          else
            php -d memory_limit=-1 -d error_reporting="E_ALL & ~E_NOTICE & ~E_DEPRECATED" bin/behat-parallel --junit=build/logs/behat/junit -- --profile=default --colors --tags='~@wip'
          fi
      - name: Verify code coverage report is not empty
        if: matrix.coverage
        run: |
          report=build/logs/behat/clover.xml
          if [ ! -s "$report" ]; then
            echo "::error::Behat coverage report $report is missing or empty"
            exit 1
          fi
          php -r '
            $metrics = simplexml_load_file($argv[1])->project->metrics;
            $covered = (int) $metrics["coveredstatements"];
            $total = (int) $metrics["statements"];
            printf("Behat coverage: %d/%d covered statements across %d files%s", $covered, $total, (int) $metrics["files"], PHP_EOL);
            if ($covered < 1000) {
                fwrite(STDERR, "::error::Behat coverage report contains too few covered statements - the coverage pipeline is broken" . PHP_EOL);
                exit(1);
            }
          ' "$report"
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behat-logs-php${{ matrix.php }}-symfony${{ matrix.symfony }}-api-platform${{ matrix.api-platform }}-listeners${{ matrix.symfony-listeners }}
          path: |
            build/logs/behat
            tests/Functional/app/var/shard-*/behat.log
        continue-on-error: true
      - name: Upload coverage results to Codecov
        if: matrix.coverage
        uses: codecov/codecov-action@v4
        with:
          flags: behat
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  phpunit-lowest-deps:
    name: PHPUnit (Symfony ${{ matrix.symfony }}) (PHP ${{ matrix.php }}) (lowest dependencies)
